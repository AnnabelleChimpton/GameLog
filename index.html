<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameLog</title>
<meta name="description" content="A video game collection.">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>

<a class="skip-link" href="#grid">Skip to the collection</a>

<header class="masthead">
  <div class="masthead__bar">
    <div class="masthead__identity">
      <h1 class="masthead__title" id="site-title">GameLog</h1>
      <p class="masthead__tagline" id="site-tagline"></p>
    </div>

    <div class="masthead__tools">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input
          id="search"
          class="search__input"
          type="search"
          placeholder="Search games…"
          aria-label="Search games by title, developer, publisher or genre"
          autocomplete="off"
          spellcheck="false">
        <kbd class="search__hint">/</kbd>
      </div>

      <label class="select">
        <span class="select__label">Sort</span>
        <select id="sort" aria-label="Sort games">
          <option value="title">Name (A–Z)</option>
          <option value="-title">Name (Z–A)</option>
          <option value="year">Year (oldest)</option>
          <option value="-year">Year (newest)</option>
          <option value="-added">Recently added</option>
          <option value="-metacritic">Highest rated</option>
        </select>
      </label>

      <button id="theme-toggle" class="icon-button" type="button"
              aria-label="Switch colour theme" title="Switch colour theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <g class="rays">
            <line x1="12" y1="1.8" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22.2"></line>
            <line x1="1.8" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22.2" y2="12"></line>
            <line x1="4.6" y1="4.6" x2="6.2" y2="6.2"></line>
            <line x1="17.8" y1="17.8" x2="19.4" y2="19.4"></line>
            <line x1="4.6" y1="19.4" x2="6.2" y2="17.8"></line>
            <line x1="17.8" y1="6.2" x2="19.4" y2="4.6"></line>
          </g>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"></path>
        </svg>
      </button>
    </div>
  </div>

  <nav class="filters" aria-label="Filter by platform">
    <div class="chips" id="platform-chips" role="tablist"></div>
  </nav>
</header>

<main>
  <div class="statline">
    <p id="count" class="statline__count" aria-live="polite"></p>
    <button id="clear" class="link-button" type="button" hidden>Clear filters</button>
  </div>

  <section id="grid" class="shelf" aria-label="Games"></section>

  <p id="empty" class="empty" hidden>
    <strong>Nothing matches that.</strong>
    <span>Try a different search, or clear the filters.</span>
  </p>

  <section id="hardware-section" class="hardware" hidden>
    <h2 class="hardware__heading">Hardware</h2>
    <div id="hardware-grid" class="hardware__grid"></div>
  </section>
</main>

<footer class="colophon">
  <p id="colophon-text"></p>
</footer>

<dialog id="detail" class="detail" aria-label="Game details">
  <div class="detail__inner">
    <button class="detail__close icon-button" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18"></line>
        <line x1="18" y1="6" x2="6" y2="18"></line>
      </svg>
    </button>

    <div class="detail__art">
      <img id="detail-cover" class="detail__cover" alt="">
    </div>

    <div class="detail__body">
      <p class="detail__eyebrow"><span id="detail-platform"></span><span id="detail-year"></span></p>
      <h2 class="detail__title" id="detail-title"></h2>
      <ul class="detail__genres" id="detail-genres"></ul>
      <p class="detail__description" id="detail-description"></p>
      <dl class="detail__meta" id="detail-meta"></dl>
      <p class="detail__notes" id="detail-notes" hidden></p>
    </div>

    <nav class="detail__nav">
      <button id="detail-prev" class="detail__step" type="button" aria-label="Previous game">‹</button>
      <button id="detail-next" class="detail__step" type="button" aria-label="Next game">›</button>
    </nav>
  </div>
</dialog>

<script src="assets/js/app.js" type="module"></script>
</body>
</html>
